server:
  port: 8080

spring:
  application:
    name: league-service
  datasource:
    url: jdbc:postgresql://postgres:5432/leaguedb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
